version: '3.8'

services:
  # --- MongoDB ---
  mongo:
    image: mongo
    container_name: sports_db
    restart: always
    ports:
      - "27017:27017"
    env_file:
      - ./Mongo/.env
    volumes:
      - ./mongo_data_prod:/data/db
      - ./Mongo/sports_db_backup.gz:/data/backup/sports_db_backup.gz
      - ./Mongo/restore.sh:/docker-entrypoint-initdb.d/restore.sh
    networks:
      - matchhub-network

  # --- Mongo Express (Admin Panel) ---
  mongo-express:
    image: mongo-express
    container_name: sports_db_admin
    restart: always
    ports:
      - "50001:8081"
    env_file:
      - ./Mongo/.env
    depends_on:
      - mongo
    networks:
      - matchhub-network

  # --- Backend Server ---
  server:
    build: ./backend
    container_name: matchhub_server
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - matchhub-network

  # --- Frontend Client ---
  client:
    build: ./frontend
    container_name: matchhub_client
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    environment:
      - CHOKIDAR_USEPOLLING=true 
    depends_on:
      - server
    networks:
      - matchhub-network

networks:
  matchhub-network:
    driver: bridge